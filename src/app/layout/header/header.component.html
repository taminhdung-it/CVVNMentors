<!-- src/app/layout/header/header.component.html -->
<header class="app-header">
  <div class="left">
    <button class="menu-btn" aria-label="Toggle sidebar" (click)="onToggle()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path *ngIf="!collapsed" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"></path>
        <path *ngIf="collapsed" d="M4 6h16v2H4zM4 11h10v2H4zM4 16h16v2H4z"></path>
      </svg>
    </button>

    <!-- bây giờ bind bằng pageTitle -->
    <div class="page-title">{{ pageTitle }}</div>
  </div>

  <div class="right">
    <div class="user-wrapper">
      <div class="user">
        <img src="../../../assets/Duong.jpg" alt="avatar" class="avatar" />
        <span class="username">{{ username }}</span>
      </div>

      <!-- Dropdown Menu (hiện khi hover) -->
      <div class="user-dropdown">
        <div class="dropdown-header">
          <img src="../../../assets/Duong.jpg" alt="avatar" class="dropdown-avatar" />
          <div class="dropdown-info">
            <div class="dropdown-name">{{ username }}</div>
            <div class="dropdown-role">Admin</div>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <div class="dropdown-menu">
          <a class="dropdown-item" (click)="goToProfile()">
            <mat-icon>person</mat-icon>
            <span>Thông tin</span>
          </a>

          <a class="dropdown-item logout" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Đăng xuất</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
