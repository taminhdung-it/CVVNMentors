<aside class="app-sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-top">
    <div class="brand">
      <div class="logo">
        <img src="../../../assets/logo.png" alt="Logo" />
      </div>
      <div class="brand-name" *ngIf="!collapsed">CV VNMentors</div>
    </div>
  </div>

  <nav class="nav">
    <ng-container *ngFor="let item of nav">
      <div class="nav-heading" *ngIf="item.heading && !collapsed">{{ item.heading }}</div>

      <a class="nav-item" *ngIf="item.title"
         [routerLink]="item.route"
         routerLinkActive="active">
        <span class="icon" [attr.title]="collapsed ? item.title : null">
          <!-- Dashboard -->
          <svg *ngIf="item.icon === 'grid'" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
          
          <!-- Statistics/Chart -->
          <svg *ngIf="item.icon === 'chart'" viewBox="0 0 24 24"><path d="M4 20h16v-2H4zM7 10h2v8H7zM11 6h2v12h-2zM15 2h2v16h-2z"/></svg>
          
          <!-- CV Management -->
          <svg *ngIf="item.icon === 'user'" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          
          <!-- Job Management -->
          <svg *ngIf="item.icon === 'briefcase'" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v3"/><line x1="12" y1="11" x2="12" y2="17"/></svg>
          
          <!-- Department Management (NEW) -->
          <svg *ngIf="item.icon === 'building'" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 6h.01M9 10h.01M9 14h.01M15 6h.01M15 10h.01M15 14h.01"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          
          <!-- Store -->
          <svg *ngIf="item.icon === 'store'" viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v9a2 2 0 0 1-2 2h-14a2 2 0 0 1-2-2z"/><rect x="7" y="12" width="10" height="7"/></svg>
          
          <!-- Staff -->
          <svg *ngIf="item.icon === 'staff'" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6"/><path d="M12 12c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/></svg>
          
          <!-- Account -->
          <svg *ngIf="item.icon === 'account'" viewBox="0 0 24 24"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z"/><path d="M4 22c0-4 4-6 8-6s8 2 8 6"/></svg>
          
          <!-- Food -->
          <svg *ngIf="item.icon === 'food'" viewBox="0 0 24 24"><path d="M7 2v8a4 4 0 0 0 4 4h0"/><path d="M21 2v8a4 4 0 0 1-4 4h0"/></svg>
          
          <!-- Tags -->
          <svg *ngIf="item.icon === 'tags'" viewBox="0 0 24 24"><path d="M20 10V6a2 2 0 0 0-2-2h-4"/><path d="M4 14l6 6 10-10-6-6L4 14z"/></svg>
          
          <!-- Settings -->
          <svg *ngIf="item.icon === 'settings'" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 0 1 2.28 17l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L4.21 2.28A2 2 0 0 1 7 2.28l.06.06A1.65 1.65 0 0 0 8.88 2.67 1.65 1.65 0 0 0 10 1.16V1a2 2 0 0 1 4 0v.16c.34.13.66.33.92.58"/></svg>
        </span>

        <span class="label" *ngIf="!collapsed">{{ item.title }}</span>
      </a>
    </ng-container>
  </nav>
</aside>
