<div class="department-page">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2>Quản lý phòng ban</h2>
      <p>Tổng phòng ban: <b>{{ filteredDepartments.length }}</b></p>
    </div>

    <button class="btn primary" (click)="openAdd()">+ Thêm phòng ban</button>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="filter-bar">
    <input
      type="text"
      placeholder="Tìm theo mã / tên phòng ban..."
      [(ngModel)]="keyword" />

    <select [(ngModel)]="statusFilter">
      <option value="ALL">Tất cả trạng thái</option>
      <option value="ACTIVE">Hoạt động</option>
      <option value="INACTIVE">Ngừng hoạt động</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Mã</th>
          <th>Tên phòng ban</th>
          <th>Mô tả</th>
          <th>Số job</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let d of filteredDepartments">
          <td class="code">{{ d.code }}</td>
          <td>{{ d.name }}</td>
          <td class="desc">{{ d.description }}</td>
          <td><span class="job-badge">{{ d.jobCount }}</span></td>
          <td>
            <span class="status" [class.active]="d.status === 'ACTIVE'"
              [class.inactive]="d.status === 'INACTIVE'">
              {{ d.status }}
            </span>
          </td>
          <td class="actions">
            <button class="btn edit" (click)="openEdit(d)">Sửa</button>
            <button class="btn delete" (click)="delete(d.id)">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal">
    <h3>{{ isEdit ? 'Sửa phòng ban' : 'Thêm phòng ban' }}</h3>

    <div class="form-group">
      <label>Mã phòng ban</label>
      <input [(ngModel)]="form.code" />
    </div>

    <div class="form-group">
      <label>Tên phòng ban</label>
      <input [(ngModel)]="form.name" />
    </div>

    <div class="form-group">
      <label>Mô tả</label>
      <textarea [(ngModel)]="form.description"></textarea>
    </div>

    <div class="form-group">
      <label>Trạng thái</label>
      <select [(ngModel)]="form.status">
        <option value="ACTIVE">Hoạt động</option>
        <option value="INACTIVE">Ngừng hoạt động</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn primary" (click)="save()">Lưu</button>
      <button class="btn cancel" (click)="close()">Hủy</button>
    </div>
  </div>
</div>
